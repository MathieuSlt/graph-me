name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      # The [ner] extra pulls PyTorch; it is tested separately once Tier 1 lands (M5).
      - run: uv sync --locked --extra medium --extra ui
      # msgvault builds the synthetic mail/WhatsApp fixtures (pinned, checksum-verified).
      - run: |
          scripts/install_msgvault.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -q
      - run: uv run graph-me --out "$RUNNER_TEMP/graph-out" init
      - run: uv run graph-me --out "$RUNNER_TEMP/graph-out" where
