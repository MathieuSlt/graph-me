# graph-me configuration. Remove the # in front of an option to use it.

# output: ~/graph-me/graph-out      # where the index is stored (default: graph-out next to this file)

sources:
  docs:
    type: filesystem                # folders on your disk
    paths: [~/Documents, ~/Desktop] # folders or files to read, subfolders included
    trust: self                     # self (your files) | known (people you know) | untrusted (anyone)
    # exclude: ["**/old-backups/**"] # patterns to skip; replaces the built-in list (.git, node_modules, caches, build output...)

  # downloads:
  #   type: filesystem
  #   paths: [~/Downloads]
  #   trust: untrusted

  # messages:
  #   type: msgvault                # mail and chats archived by msgvault (https://github.com/kenn-io/msgvault)
  #   db: ~/.msgvault               # msgvault folder or its msgvault.db file
  #   accounts: []                  # only these accounts (emails, phone numbers); empty = all
  #   contacts: true                # also read the address book synced into msgvault

  # contacts:
  #   type: vcard                   # address books exported as .vcf
  #   paths: [~/contacts.vcf]       # .vcf files or folders containing them

people:
  phone_country_code: null          # your calling code without "+", e.g. "44", so 07700 900123 matches +44 7700 900123
  me: []                            # your own emails and phone numbers, if a source can't tell which messages are yours
  timezone: null                    # e.g. America/New_York; decides which day a message was sent (default: this computer's)

blacklist:
  paths: []                         # folders and files never to index
  contacts: []                      # emails or phone numbers: every item involving them is dropped
  patterns: []                      # regular expressions: items whose text matches are dropped

extraction:                         # used only by `graph-me enrich` (needs graph-me[medium])
  medium:
    llm:
      provider: agent               # agent (your AI assistant) | ollama | anthropic | openai_compat
      # model: qwen3:4b             # default: qwen3:4b (ollama), claude-opus-5-5 (anthropic); required for openai_compat
      # base_url: http://localhost:11434   # server address for ollama or openai_compat
      # api_key_env: OPENAI_API_KEY # name of the environment variable holding the API key
    embeddings: local               # local (on-device model, ~220 MB) | none | a fastembed model name
