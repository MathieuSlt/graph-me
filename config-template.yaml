# graph-me configuration template.
# `graph-me init` copies it to config.yaml (~/graph-me/config.yaml, or the repo root inside a
# clone). You can also copy it by hand. config.yaml holds your paths: it is git-ignored.
#
# Nothing is excluded by default: only the blacklist below and each source's `exclude`
# (noise such as build folders) filter what gets indexed.

# Where graph-out lives. Default: next to this file. `--out` or GRAPH_ME_OUT override it.
# output: ~/graph-me/graph-out

people:
  # Country calling code for phone numbers written without it ("06 12 34 56 78"), so a contact's
  # number matches the same person on WhatsApp ("+33 6 12 34 56 78"). Example: "33" for France.
  phone_country_code: null
  # Your own emails / phone numbers, if a source can't tell which messages are yours.
  me: []
  # Time zone that decides which day a message was sent (a wish at 00:30 is for that day).
  # Default: this computer's. Set it when graph-me runs on a server or container in UTC.
  timezone: null   # e.g. Europe/Paris

extraction:
  # none = Tier 0, no model at all (free, offline; results are less convincing without AI)
  # medium = Tier 1 (`graph-me enrich`), high = Tier 2 (after v1)
  default_tier: none
  medium:
    # Who labels file names and contacts (short strings only):
    #   agent          your agent (Claude Code) answers batch files: no API key, nothing to install
    #   ollama         a local model (model: qwen3:4b by default; base_url for another host)
    #   anthropic      Claude API (model: claude-opus-5-5 by default; key from ANTHROPIC_API_KEY
    #                  or `ant auth login`). Sends file names and contact cards to Anthropic.
    #   openai_compat  any OpenAI-compatible server (model: required; api_key_env, base_url)
    llm: { provider: agent }
    # Meaning-based search: "local" runs a multilingual model on this computer (downloaded once,
    # ~220 MB, into ~/.cache/graph-me/models), "none" turns it off.
    embeddings: local
  high:
    llm: { provider: anthropic, model: claude-sonnet-5-5 }

sources:
  docs:
    type: filesystem
    paths: [~/Documents, ~/Desktop]
    exclude: ["**/node_modules/**", "**/.git/**", "**/.venv/**", "**/__pycache__/**"]
    trust: self      # self (your own files) | untrusted (content from others)
  # downloads:
  #   type: filesystem
  #   paths: [~/Downloads]
  #   trust: untrusted  # downloaded files come from other people
  # Mail and chats: we recommend msgvault (https://github.com/kenn-io/msgvault). It syncs or
  # imports Gmail, IMAP, Microsoft 365, MBOX, PST, WhatsApp, iMessage, Slack, Discord, meetings,
  # calendars and contacts (CardDAV). graph-me only reads its database, read-only.
  # Note: msgvault's Gmail login asks for the gmail.modify scope (for its own deletion flow);
  # graph-me itself never writes to msgvault or to your accounts.
  # messages:
  #   type: msgvault
  #   db: ~/.msgvault          # msgvault home folder or its msgvault.db file
  #   accounts: []             # optional: only these accounts (emails, phone numbers)
  #   contacts: true           # also read raw address-book entries synced into msgvault
  # Address books exported as .vcf (Google Contacts, iCloud, phones), without msgvault:
  # contacts:
  #   type: vcard
  #   paths: [~/contacts.vcf]

blacklist:
  paths: []        # e.g. ~/Documents/medical
  contacts: []     # emails or phone numbers: every item involving that person is dropped
  patterns: []     # regular expressions matched against text
