[project]
name = "graph-me"
version = "0.0.1"
description = "A local knowledge graph of your personal data (files, mail, WhatsApp) for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Mathieu Salliot" }]
keywords = ["knowledge-graph", "personal-data", "mcp", "claude-code", "local-first"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
# Core = Tier 0: no model, no network. AI dependencies live in extras only.
dependencies = [
    "typer>=0.27",
    "pydantic>=2.13",
    "pyyaml>=6.0.3",
    "pypdfium2>=5.13",
    "openpyxl>=3.1.5",
    "charset-normalizer>=3.5",
    "dateparser>=1.4",
    "networkx>=3.7",
    "mcp>=2.2",
    "mcp-types>=2.2",
]

[project.optional-dependencies]
medium = ["sqlite-vec==0.1.9", "fastembed>=0.8", "httpx>=0.28", "anthropic>=1.9"]
ner = ["gliner>=0.2.29"]
ui = ["starlette>=1.7", "uvicorn>=0.35", "jinja2>=3.1"]
all = ["graph-me[medium,ner,ui]"]

[project.scripts]
graph-me = "graph_me.cli:app"

[dependency-groups]
dev = ["pytest>=9.1", "hypothesis>=6.168", "ruff>=0.13"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_me"]

[tool.hatch.build.targets.wheel.force-include]
# The template lives at the repo root for visibility and ships inside the package for `init`.
"config-template.yaml" = "graph_me/config-template.yaml"

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
